<title>Plant Planner Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* Layout concept: three work areas (Process, Orders, Production GPT) in one shell.
     Indigo marks the order being looked at and every action. Red, amber and green mean only one thing: can the date be met. */
  :root {
    --bg: #eef1f6; --surface: #ffffff; --ink: #161c2e; --muted: #566079; --line: #d3d9e4; --fill: #e6eaf2;
    --accent: #27348b; --on-accent: #ffffff; --accent-soft: #e3e7fb; --other: #b9c1d1;
    --ok: #17694a; --ok-bg: #dff3e8; --warn: #8a5200; --warn-bg: #fdeccb; --risk: #b3261e; --risk-bg: #fbe5e2;
    --idle: #566079; --idle-bg: #e6eaf2;
    --display: "Space Grotesk", "Inter", system-ui, sans-serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1320; --surface: #181e2f; --ink: #e8ebf4; --muted: #9aa4bd; --line: #2e3650; --fill: #222a40;
      --accent: #9db0ff; --on-accent: #0f1630; --accent-soft: #232d57; --other: #475170;
      --ok: #6fd0a0; --ok-bg: #14302a; --warn: #f2b45a; --warn-bg: #34270f; --risk: #ff9c90; --risk-bg: #3b1f1d;
      --idle: #9aa4bd; --idle-bg: #222a40; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1320; --surface: #181e2f; --ink: #e8ebf4; --muted: #9aa4bd; --line: #2e3650; --fill: #222a40;
    --accent: #9db0ff; --on-accent: #0f1630; --accent-soft: #232d57; --other: #475170;
    --ok: #6fd0a0; --ok-bg: #14302a; --warn: #f2b45a; --warn-bg: #34270f; --risk: #ff9c90; --risk-bg: #3b1f1d;
    --idle: #9aa4bd; --idle-bg: #222a40; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; margin: 0;
    padding-block: 18px 30px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  h1, h2, h3, h4 { font-family: var(--display); margin: 0; letter-spacing: -0.01em; }
  h1 { font-size: 20px; } h2 { font-size: 17px; } h3 { font-size: 14px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }

  .shell { display: grid; grid-template-columns: 200px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; height: min(940px, calc(100vh - 36px)); min-height: 640px; }
  .side { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; background: color-mix(in srgb, var(--fill) 55%, var(--surface)); }
  .brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; font-family: var(--display); font-weight: 700; }
  .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); flex: none; position: relative; }
  .mark::after { content: ""; position: absolute; left: 7px; top: 7px; width: 12px; height: 12px; border: 2px solid var(--on-accent); border-radius: 50%; }
  .navbtn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; }
  .navbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .navbtn[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
  .badge { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 7px; }
  .side-foot { margin-top: auto; padding: 8px; color: var(--muted); font-size: 12px; }
  .mainwrap { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .bar h1 { margin-right: auto; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
  main { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }

  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn[disabled] { opacity: 0.65; cursor: default; }
  .btn:focus-visible, .navbtn:focus-visible, .row-link:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.risk { background: var(--risk-bg); color: var(--risk); } .chip.idle { background: var(--idle-bg); color: var(--idle); }
  .chip.acc { background: var(--accent-soft); color: var(--accent); }
  .card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px; min-width: 0; }
  .stack-v { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .sect { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 15px; }
  .sect .step { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--accent); color: var(--on-accent); flex: none; }
  .sect .step.pending { background: var(--fill); color: var(--muted); }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .r { text-align: right; }
  .nw { white-space: nowrap; }
  .tablewrap { overflow-x: auto; }
  .tablewrap table { min-width: 560px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .stat small { display: block; color: var(--muted); font-weight: 500; }
  .stat strong { display: block; font-family: var(--display); font-size: 19px; margin: 2px 0; }
  .stat .sub { color: var(--muted); font-size: 12px; }
  .progress { display: flex; gap: 8px; flex-wrap: wrap; }
  .progress .chip { padding: 4px 10px; }
  .pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }

  /* process */
  textarea { width: 100%; min-height: 130px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
  .flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px; align-items: stretch; }
  .fnode { min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); position: relative; }
  .fnode b { display: block; font-size: 13px; } .fnode .s { display: block; color: var(--muted); font-size: 12px; }
  .fnode .cap { display: block; margin-top: 4px; font-weight: 600; font-size: 12.5px; }
  .fnode.bn { border-color: var(--warn); background: color-mix(in srgb, var(--warn-bg) 50%, var(--surface)); }
  .fnode.ext { border-style: dashed; }
  .num-in { width: 76px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; text-align: right; }
  .qs { margin: 6px 0 0; padding-left: 18px; } .qs li { margin-bottom: 4px; }

  /* orders */
  .row-link { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
  .crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); margin-bottom: 10px; }
  .crumbs button { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; }
  .quote { margin: 0; padding: 8px 10px; border-left: 3px solid var(--line); color: var(--muted); font-style: italic; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-top: 10px; }
  .fields div { background: var(--fill); border-radius: 8px; padding: 6px 9px; }
  .fields small { display: block; color: var(--muted); }
  .verdict { border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line); border-left-width: 6px; }
  .verdict.ok { border-left-color: var(--ok); background: color-mix(in srgb, var(--ok-bg) 45%, var(--surface)); }
  .verdict.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn-bg) 45%, var(--surface)); }
  .verdict.risk { border-left-color: var(--risk); background: color-mix(in srgb, var(--risk-bg) 45%, var(--surface)); }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .opt { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .opt.rec { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .opt .big { font-family: var(--display); font-size: 17px; font-weight: 700; }
  .opt .actions { margin-top: auto; }
  .risks { margin: 6px 0 0; padding-left: 18px; } .risks li { margin-bottom: 4px; }
  .chartwrap { overflow-x: auto; }
  svg.chart text { font-family: var(--sans); }
  .chart .tick { font-size: 10px; fill: var(--muted); } .chart .rowlab { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .chart .rowsub { font-size: 10px; fill: var(--muted); } .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .bar-other { fill: var(--other); } .chart .bar-this { fill: var(--accent); }
  .chart .capline { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 2; }
  .chart .down { fill: var(--warn-bg); } .chart .dnlab { font-size: 9px; fill: var(--warn); }
  .chart .ship { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; } .chart .shiplab { font-size: 10px; font-weight: 600; fill: var(--ink); }
  .chart .ready.ok { stroke: var(--ok); } .chart .ready.warn { stroke: var(--warn); } .chart .ready.risk { stroke: var(--risk); }
  .chart .ready { stroke-width: 2; } .chart .readylab.ok { fill: var(--ok); } .chart .readylab.warn { fill: var(--warn); } .chart .readylab.risk { fill: var(--risk); } .chart .readylab { font-size: 10px; font-weight: 700; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .ubar { height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; min-width: 80px; }
  .ubar span { display: block; height: 100%; background: var(--accent); }
  .ubar.hot span { background: var(--warn); }

  /* production gpt */
  .insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .insight { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
  .insight small { display: block; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px; }
  .insight b { display: block; font-family: var(--display); font-size: 16px; margin: 2px 0; }
  .chat { height: 420px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, var(--fill) 40%, var(--surface)); border-radius: 10px; }
  .msg { max-width: 92%; padding: 9px 11px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .msg details { margin-top: 8px; color: var(--muted); } .msg summary { cursor: pointer; font-weight: 600; }
  .msg ul { margin: 6px 0 0; padding-left: 18px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .ask { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; max-width: calc(100% - 32px); }
  .bottomnav { display: none; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 760px) {
    body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
    .shell { display: block; height: auto; min-height: 0; border: 0; background: transparent; border-radius: 0; overflow: visible; }
    .side { display: none; }
    .bar { padding: 4px 0 10px; border-bottom: 0; }
    main { overflow: visible; padding: 0; }
    .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
    .bottomnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface); border-top: 1px solid var(--line);
      padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
    .bottomnav .navbtn { flex-direction: column; gap: 2px; font-size: 11px; text-align: center; padding: 6px 2px; }
    .row-link { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <div class="shell">
    <aside class="side" aria-label="Main navigation">
      <div class="brand"><span class="mark" aria-hidden="true"></span>Plant Planner</div>
      <div id="nav-side"></div>
      <div class="side-foot">Kovai Knits<br>Sample data. Nothing is sent.</div>
    </aside>
    <div class="mainwrap">
      <header class="bar"><h1 id="title">Process</h1><span class="avatar" aria-label="Meena">M</span></header>
      <main id="main"></main>
    </div>
  </div>
  <nav class="bottomnav" id="nav-bottom" aria-label="Main navigation"></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  var D = function (m, d) { return Math.round(Date.UTC(2027, m - 1, d) / 864e5); };
  var MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var fmt = function (n) { var t = new Date(n * 864e5); return MN[t.getUTCMonth()] + " " + t.getUTCDate(); };
  var plural = function (n) { return n + (Math.abs(n) === 1 ? " day" : " days"); };
  var f0 = function (x) { return Math.round(x).toLocaleString("en-IN"); };
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); };

  var SLOTS = [D(6,28), D(7,7), D(7,16), D(7,25)];
  var proc = { knit:{ n:12, rate:350 }, link:{ n:6, rate:800 }, board:{ n:2, rate:2500 }, pair:{ n:30, rate:200 }, pack:{ n:13, rate:500 } };
  var STEPS = [
    { id:"knit", name:"Knitting", unit:"machines", per:"machine" },
    { id:"link", name:"Toe closing", unit:"machines", per:"machine" },
    { id:"board", name:"Boarding and steaming", unit:"lines", per:"line" },
    { id:"pair", name:"Pairing and quality check", unit:"people", per:"person" },
    { id:"pack", name:"Packing", unit:"stations", per:"station" }
  ];
  var DOWN0 = [{ step:"knit", from:D(7,15), to:D(7,25), n:2, why:"planned maintenance" }];

  var ORDERS = [
    { id:"SO-1182", cust:"US retailer", item:"Cotton-blend sports socks", pairs:50000, shipBy:D(7,20), yarnArr:D(6,25), g:90, el:3, perCarton:12,
      hand:{ yarn:1200, el:40, label:8000, carton:500 }, status:"Booked", src:"PO 5521, PDF by email",
      text:"50,000 pairs sports socks, cotton blend, 3 colours. Ship by July 20. Deliver to the US warehouse by Aug 24. 12 pairs per carton, retail labels. Payment net 30.",
      fields:[["Product","Cotton-blend sports socks","97%"],["Quantity","50,000 pairs","99%"],["Ship by","Jul 20","96%"],["Colours","3, names not given","62%",1],["Packing","12 pairs a carton, retail labels","88%"],["Payment","Net 30","71%",1]] },
    { id:"SO-1190", cust:"Gulf distributor", item:"Plain cotton ankle socks", pairs:20000, shipBy:D(8,12), yarnArr:D(7,3), g:60, el:2, perCarton:24,
      hand:{ yarn:0, el:0, label:0, carton:0 }, status:"Booked", src:"Email from the distributor",
      text:"20,000 pairs plain ankle socks, white and black. Ship by 12 August. 24 pairs per carton. 30% advance, balance on shipping documents.",
      fields:[["Product","Plain cotton ankle socks","95%"],["Quantity","20,000 pairs","99%"],["Ship by","Aug 12","94%"],["Colours","White and black","97%"],["Packing","24 pairs a carton","90%"],["Payment","30% advance","83%"]] },
    { id:"SO-1195", cust:"European retailer", item:"Cotton-blend sports socks", pairs:30000, shipBy:D(7,28), yarnArr:D(7,5), g:90, el:3, perCarton:12,
      hand:{ yarn:0, el:0, label:0, carton:0 }, status:"New request", src:"Email from the European retailer",
      text:"Could you make 30,000 pairs of the same cotton-blend sports sock as last time, in 4 colours, shipped by 28 July? Cartons of 12 with EU labels. Please confirm by Friday.",
      fields:[["Product","Cotton-blend sports socks (same as SO-1182)","91%"],["Quantity","30,000 pairs","98%"],["Ship by","Jul 28","93%"],["Colours","4, names not given","58%",1],["Packing","12 pairs a carton, EU labels","85%"],["Reply needed","By Friday","90%"]] }
  ];
  var byId = function (id) { return ORDERS.filter(function (o) { return o.id === id; })[0]; };

  var state = { view:"process", order:null, second:false, prio:false, booked:{}, analyzed:{}, stage:3, gpt:[], confirmed:{}, reading:false };

  /* ---------- engine ---------- */
  function flags(extra) { var fl = { second:state.second, prio:state.prio, down:DOWN0.slice() }; if (extra) for (var k in extra) fl[k] = extra[k]; return fl; }
  function cap(id, d, fl) {
    var n = proc[id].n;
    (fl.down || []).forEach(function (x) { if (x.step === id && d >= x.from && d <= x.to) n = Math.max(0, n - x.n); });
    var c = n * proc[id].rate; if (id === "knit" && fl.second) c *= 1.5; return Math.round(c);
  }
  function capNominal(id, fl) { return cap(id, -99999, { second:fl.second, down:[] }); }
  function slotFor(o) { var a = o.yarnArr + 1; for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i] >= a) return SLOTS[i]; return a; }
  function sumTo(u, upto) { var s = 0; for (var k in u) if (+k <= upto) s += u[k]; return s; }
  function sched(o, committed, fl) {
    var ds = slotFor(o), df = ds + 4, ks = df + 1, res = { id:o.id, dye:{ start:ds, finish:df }, steps:{} };
    STEPS.forEach(function (st, i) {
      var usage = {}, rem = o.pairs, done = 0, d = i === 0 ? ks : res.steps[STEPS[i - 1].id].start + 1, first = null, last = null, g = 0;
      while (rem > 0 && g++ < 400) {
        var free = cap(st.id, d, fl) - (committed[st.id][d] || 0);
        var up = i === 0 ? Infinity : (sumTo(res.steps[STEPS[i - 1].id].usage, d - 1) - done);
        var use = Math.max(0, Math.min(free, up, rem));
        if (use > 0) { usage[d] = use; done += use; rem -= use; if (first === null) first = d; last = d; }
        d++;
      }
      if (first === null) { first = d; last = d; }
      for (var k in usage) committed[st.id][k] = (committed[st.id][k] || 0) + usage[k];
      res.steps[st.id] = { start:first, finish:last, usage:usage, days:last - first + 1 };
    });
    res.ready = res.steps.pack.finish + 2; res.slack = o.shipBy - res.ready; return res;
  }
  function computeAll(fl) {
    var committed = {}; STEPS.forEach(function (s) { committed[s.id] = {}; });
    var seq = fl.prio ? ["SO-1182","SO-1195","SO-1190"] : ["SO-1182","SO-1190","SO-1195"], out = {};
    seq.forEach(function (id) { out[id] = sched(byId(id), committed, fl); });
    out._committed = committed; return out;
  }
  function verdict(r, o) {
    var s = r.slack;
    if (s >= 2) return { c:"ok", t:"Feasible", d:"Ready to ship " + fmt(r.ready) + ", " + plural(s) + " before the " + fmt(o.shipBy) + " deadline." };

        '<div class="stats" style="margin-top:10px"><div class="card stat"><small>Ready to ship</small><strong class="num">' + fmt(r.ready) + '</strong><span class="sub">Deadline ' + fmt(o.shipBy) + '</span></div><div class="card stat"><small>Buffer</small><strong class="num">' + (r.slack >= 0 ? plural(r.slack) : plural(-r.slack) + " late") + '</strong><span class="sub">Deadline minus ready date</span></div><div class="card stat"><small>Knitting window</small><strong class="num">' + fmt(r.steps.knit.start) + " to " + fmt(r.steps.knit.finish) + '</strong><span class="sub">' + plural(r.steps.knit.days) + "</span></div></div>" +

        STEPS.map(function (s) { var x = r.steps[s.id]; return "<tr><td><b>" + s.name + '</b></td><td class="num">' + fmt(x.start) + '</td><td class="num">' + fmt(x.finish) + '</td><td class="num">' + x.days + "</td></tr>"; }).join("") +
        '<tr><td><b>Dispatch</b></td><td class="num">' + fmt(r.steps.pack.finish + 1) + '</td><td class="num">' + fmt(r.ready) + '</td><td class="num">2</td></tr></tbody></table></div>' +
        '<h3 style="margin:14px 0 6px">Materials</h3><div class="tablewrap"><table><thead><tr><th>Item</th><th class="r">Needed</th><th class="r">On hand</th><th class="r">Buy</th><th>Vendor</th><th>Expected</th></tr></thead><tbody>' + materialsRows(o, r) + "</tbody></table></div>" +
        '<h3 style="margin:14px 0 0">What could go wrong</h3><ul class="risks">' + risksFor(o, r, res, fl).map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ul>" +
        '<h3 style="margin:14px 0 6px">Options</h3><div class="opts">' + optionCards(o, res, fl) + "</div>" +
        (isNew ? '<h3 style="margin:14px 0 6px">Draft reply to the customer</h3><div class="opt"><span style="font-style:italic">' + esc(replyDraft(o, r, fl)) + '</span><div class="actions"><button class="btn small" data-act="toast" data-m="In the real app you can edit the reply here.">Edit</button><button class="btn small" data-act="toast" data-m="Sample only. Nothing was sent.">Approve and send</button></div></div>' : "") +
        '<div class="actions"><button class="btn primary" data-act="book" data-id="' + o.id + '"' + (o.status !== "New request" || state.booked[o.id] ? " disabled" : "") + ">" + (o.status !== "New request" ? "Already booked" : state.booked[o.id] ? "Booked (sample)" : "Accept and book this plan") + '</button><button class="btn" data-act="gpt-order" data-id="' + o.id + '">Ask Production GPT about this order</button></div></div>';
    }
    return h + "</div>";
  }

  /* ---------- PRODUCTION GPT ---------- */
  function insightsHtml() {
    var fl = flags(), res = computeAll(fl), bn = bottleneck(fl);
    var tight = ORDERS.map(function (o) { return { o:o, r:res[o.id] }; }).sort(function (a, b) { return a.r.slack - b.r.slack; })[0];
    var u = utilOf("knit", D(7,1), D(7,31), res, fl);
    var rows = [
      ["Bottleneck", bn.name + ", " + f0(bn.c) + " a day", "Every other step can keep up with it."],
      ["Tightest order", tight.o.id + ", " + (tight.r.slack >= 0 ? plural(tight.r.slack) + " of buffer" : plural(-tight.r.slack) + " late"), "Ready " + fmt(tight.r.ready) + " against " + fmt(tight.o.shipBy) + "."],
      ["Knitting in July", Math.round(u * 100) + "% booked", "Maintenance Jul 15 to 25 takes 2 machines out."],
      ["New request", verdict(res["SO-1195"], byId("SO-1195")).t, "SO-1195, ready " + fmt(res["SO-1195"].ready) + "."]
    ];
    return rows.map(function (r) { return '<div class="insight"><small>' + r[0] + "</small><b>" + r[1] + '</b><span class="muted">' + r[2] + "</span></div>"; }).join("");
  }
  function orderAnswer(id) {
    var o = byId(id), fl = flags(), res = computeAll(fl), r = res[id], v = verdict(r, o), risks = risksFor(o, r, res, fl);
    var calc = ["Ready date = packing finish (" + fmt(r.steps.pack.finish) + ") + 2 days dispatch = " + fmt(r.ready), "Buffer = deadline (" + fmt(o.shipBy) + ") minus ready (" + fmt(r.ready) + ") = " + r.slack + " days", "Knitting " + fmt(r.steps.knit.start) + " to " + fmt(r.steps.knit.finish) + " at up to " + f0(capNominal("knit", fl)) + " pairs a day"];
    var opt = ""; if (id === "SO-1195" && r.slack < 2) { var a = computeAll(flags({ second:true, prio:true }))[id]; opt = " Neither a second shift nor running ahead of SO-1190 is enough alone. Both together make it: ready " + fmt(a.ready) + ", " + plural(a.slack) + " to spare."; }
    return { html:"<b>" + id + ": " + v.t + ".</b> " + v.d + opt + "<ul>" + risks.slice(0, 3).map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ul>", calc:calc };
  }
  function gptAnswer(q) {
    var s = q.toLowerCase(), fl = flags(), res = computeAll(fl), m = s.match(/(?:so-?)?(1182|1190|1195)/);
    if (m) return orderAnswer("SO-" + m[1]);
    if (/break|breakdown|fail|goes down|go down/.test(s)) {
      var rx = computeAll(flags({ down:DOWN0.concat([{ step:"knit", from:D(7,3), to:D(7,10), n:2, why:"breakdown" }]) })), lines = [], calc = [];
      ORDERS.forEach(function (o) { var a = res[o.id], b = rx[o.id]; if (a.ready !== b.ready) lines.push("<li>" + o.id + " ready " + fmt(b.ready) + " instead of " + fmt(a.ready) + " (" + (b.slack >= 0 ? plural(b.slack) + " of buffer" : plural(-b.slack) + " late") + ")</li>"); calc.push(o.id + ": ready " + fmt(a.ready) + " to " + fmt(b.ready)); });
      return { html:"If 2 knitting machines break down from Jul 3 to Jul 10, knitting falls from " + f0(capNominal("knit", fl)) + " to " + f0(cap("knit", D(7,5), { second:state.second, down:[{ step:"knit", from:D(7,3), to:D(7,10), n:2 }] })) + " pairs a day for 8 days." + (lines.length ? "<ul>" + lines.join("") + "</ul>" : " No ship date changes.") + "A day-by-day plan with the knitters on overtime would be the first fix to test.", calc:calc };
    }
    if (/second shift|extra shift|overtime|add a shift/.test(s)) {
      var r2 = computeAll(flags({ second:true })), rb = computeAll(flags({ second:false })), ls = [], c2 = [];
      ORDERS.forEach(function (o) { ls.push("<li>" + o.id + ": ready " + fmt(r2[o.id].ready) + " (" + fmt(rb[o.id].ready) + " without), " + (r2[o.id].slack >= 0 ? plural(r2[o.id].slack) + " of buffer" : plural(-r2[o.id].slack) + " late") + "</li>"); c2.push("Knitting " + f0(capNominal("knit", { second:false })) + " x 1.5 = " + f0(capNominal("knit", { second:true })) + " pairs a day"); });
      return { html:"A second shift on knitting lifts knitting to " + f0(capNominal("knit", { second:true })) + " a day, but toe closing then limits the line at " + f0(capNominal("link", fl)) + ". Effect:<ul>" + ls.join("") + "</ul>Extra labour cost is not included.", calc:[c2[0], "Toe closing " + proc.link.n + " x " + proc.link.rate + " = " + f0(capNominal("link", fl)) + " pairs a day (new limit)"] };
    }
    if (/bottleneck|slowest|limit/.test(s) || /per day|a day|how much can|how many|capacity/.test(s)) {
      var bn = bottleneck(fl), l = STEPS.map(function (st) { return "<li>" + st.name + ": " + proc[st.id].n + " " + st.unit + " x " + f0(proc[st.id].rate) + " = " + f0(capNominal(st.id, fl)) + "</li>"; }).join("");
      return { html:"The plant can finish about <b>" + f0(bn.c) + " pairs a day</b>. " + bn.name + " is the limit. During maintenance (Jul 15 to 25) knitting drops to " + f0(cap("knit", D(7,20), fl)) + " a day. With a second shift it would be " + f0(capNominal("knit", { second:true })) + ", and toe closing (" + f0(capNominal("link", fl)) + ") becomes the limit.", calc:STEPS.map(function (st) { return st.name + ": " + proc[st.id].n + " x " + proc[st.id].rate + " = " + f0(capNominal(st.id, fl)); }) };
    }
    if (/busy|util|load|workload|booked/.test(s)) {
      var rows = STEPS.map(function (st) { var u = utilOf(st.id, D(7,1), D(7,31), res, fl); return { st:st, u:u }; });
      return { html:"Share of July capacity already booked:<ul>" + rows.map(function (x) { return "<li>" + x.st.name + ": " + Math.round(x.u * 100) + "%</li>"; }).join("") + "</ul>Knitting is the busiest, so new work competes for it first.", calc:["Booked pairs in Jul 1 to Jul 31 divided by capacity in the same days, per step", "Includes maintenance days at reduced capacity"] };
    }
    if (/risk|late|tight|buffer|slack|worry/.test(s)) {
      var sorted = ORDERS.map(function (o) { return { o:o, r:res[o.id] }; }).sort(function (a, b) { return a.r.slack - b.r.slack; });
      return { html:"Order by risk:<ul>" + sorted.map(function (x) { return "<li><b>" + x.o.id + "</b>: " + (x.r.slack >= 0 ? plural(x.r.slack) + " of buffer" : plural(-x.r.slack) + " late") + ", ready " + fmt(x.r.ready) + " against " + fmt(x.o.shipBy) + "</li>"; }).join("") + "</ul>The yarn from Ravi is the main outside risk: he usually runs about 6 days late.", calc:sorted.map(function (x) { return x.o.id + ": " + x.r.slack + " days = deadline minus ready"; }) };
    }
    if (/free|available|spare|when can|gap/.test(s)) {
      var last = 0, gaps = [], d; for (d = D(7,1); d <= D(8,31); d++) { var used = 0; for (var k in res) { if (k.charAt(0) !== "_") used += res[k].steps.knit.usage[d] || 0; } if (used > 0) last = d; var free = cap("knit", d, fl) - used; if (used > 0 && free >= 1000) gaps.push(fmt(d) + " (" + f0(free) + " pairs)"); }
      return { html:"Knitting is booked through " + fmt(last) + ". After that the full " + f0(capNominal("knit", fl)) + " pairs a day is free." + (gaps.length ? " Small gaps before then: " + gaps.slice(0, 3).join(", ") + "." : ""), calc:["Free = capacity minus booked pairs, day by day"] };
    }
    return { plain:true, html:"I can answer questions about capacity, bottlenecks, how busy the machines are, which order is at risk, a specific order such as SO-1195, and what-ifs like a second shift or a machine breakdown. Try one of the suggestions below.", calc:[] };
  }
  function ctxNote() { var p = []; if (state.second) p.push("a second shift on knitting"); if (state.prio) p.push("SO-1195 scheduled ahead of SO-1190"); if (!p.length) return ""; return '<p class="muted" style="margin-top:8px">Using your current plan: ' + p.join(" and ") + '. <button type="button" class="btn small" data-act="reset-flags">Use the base plan</button></p>'; }
  function viewGpt() {
    var h = '<div class="stack-v"><div><h2>Production GPT</h2><p class="muted">Ask anything about production. Answers come from your process, your machines and your orders, and show their working.</p></div>' +
      (ctxNote() || '<p class="muted">Using the base plan: no extra shift, orders in due-date order.</p>') + '<div class="insights">' + insightsHtml() + "</div>" +
      '<div class="card"><div class="chat" id="chat" aria-live="polite">' + gptMsgs() + '</div><div class="chips">' +
      ["How much can I make in a day?","Which order is most at risk?","Can I accept SO-1195?","What if I add a second shift?","What if 2 knitting machines break down Jul 3 to 10?","How busy are the machines in July?","When is knitting free?"].map(function (q) { return '<button type="button" class="btn small" data-act="ask" data-q="' + q + '">' + q + "</button>"; }).join("") +
      '</div><form class="ask" id="askform"><label for="q" style="position:absolute;left:-9999px">Ask Production GPT</label><input id="q" type="text" placeholder="Ask about capacity, orders or what-ifs" autocomplete="off"><button class="btn primary" type="submit">Ask</button></form></div></div>';
    return h;
  }
  function gptMsgs() {
    return state.gpt.map(function (m) {
      if (m.role === "user") return '<div class="msg user">' + esc(m.html) + "</div>";
      return '<div class="msg">' + m.html + (m.calc && m.calc.length ? "<details><summary>Show the calculation</summary><ul>" + m.calc.map(function (c) { return "<li>" + c + "</li>"; }).join("") + "</ul></details>" : "") + "</div>";
    }).join("");
  }
  function gptAsk(q) {
    var a = gptAnswer(q); state.gpt.push({ role:"user", html:q }); state.gpt.push({ role:"gpt", html:a.html + (a.plain ? "" : ctxNote()), calc:a.calc });
    var ch = $("#chat"); if (ch) { ch.innerHTML = gptMsgs(); ch.scrollTop = ch.scrollHeight; }
  }

  /* ---------- render and events ---------- */
  var TITLES = { process:"Process", orders:"Orders", order:"Order", gpt:"Production GPT" };
  var timers = [];
  function render() {
    $("#title").textContent = state.view === "order" ? state.order : TITLES[state.view];
    $("#nav-side").innerHTML = navHtml(); $("#nav-bottom").innerHTML = navHtml();
    var fn = { process:viewProcess, orders:viewOrders, order:viewOrder, gpt:viewGpt }[state.view];
    var main = $("#main"), top = main.scrollTop; main.innerHTML = fn(); main.scrollTop = top;
    if (state.view === "gpt") { var ch = $("#chat"); if (ch) ch.scrollTop = ch.scrollHeight; }
  }
  function go(v, id) {
    timers.forEach(clearTimeout); timers = [];
    state.view = v;
    if (v === "order") {
      state.order = id;
      if (!state.analyzed[id]) {
        state.stage = 0; render();
        timers.push(setTimeout(function () { state.stage = 1; render(); }, 450));
        timers.push(setTimeout(function () { state.stage = 2; render(); }, 1000));
        timers.push(setTimeout(function () { state.stage = 3; state.analyzed[id] = true; render(); }, 1550));
        try { history.replaceState(null, "", "#order-" + id.slice(3)); } catch (e) {}
        window.scrollTo(0, 0); $("#main").scrollTop = 0; return;
      }
      try { history.replaceState(null, "", "#order-" + id.slice(3)); } catch (e) {}
    } else { try { history.replaceState(null, "", "#" + v); } catch (e) {} }
    render(); $("#main").scrollTop = 0; window.scrollTo(0, 0);
  }
  function toast(m) { var t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2600); }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
    var a = t.getAttribute("data-act");
    if (a === "go") go(t.getAttribute("data-v"));
    else if (a === "open-order") go("order", t.getAttribute("data-id"));
    else if (a === "flag") { state[t.getAttribute("data-k")] = t.checked; render(); }
    else if (a === "opt") { var k = t.getAttribute("data-a"); if (k === "second") state.second = !state.second; else if (k === "prio") state.prio = !state.prio; else { var both = state.second && state.prio; state.second = !both; state.prio = !both; } render(); }
    else if (a === "book") { state.booked[t.getAttribute("data-id")] = true; render(); toast("Booked (sample). Nothing was sent."); }
    else if (a === "confirm") { state.confirmed[t.getAttribute("data-k")] = true; render(); }
    else if (a === "redesign") { state.reading = true; render(); setTimeout(function () { state.reading = false; render(); toast("Plan updated: 7 steps, 3 questions to confirm"); }, 1400); }
    else if (a === "ask") { gptAsk(t.getAttribute("data-q")); }
    else if (a === "gpt-order") { state.view = "gpt"; render(); var id = t.getAttribute("data-id"); gptAsk(id === "SO-1195" ? "Can I accept SO-1195?" : "How tight is " + id + "?"); window.scrollTo(0, 0); try { history.replaceState(null, "", "#gpt"); } catch (e2) {} }
    else if (a === "reset-flags") { state.second = false; state.prio = false; render(); }
    else if (a === "toast") toast(t.getAttribute("data-m"));
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.hasAttribute && el.hasAttribute("data-proc")) { var v = Math.max(1, Math.round(+el.value || 1)); proc[el.getAttribute("data-proc")][el.getAttribute("data-field")] = v; render(); toast("Plan updated with the new number"); }
    else if (el.getAttribute && el.getAttribute("data-act") === "flag") { state[el.getAttribute("data-k")] = el.checked; render(); }
  });
  document.addEventListener("submit", function (e) { if (e.target.id === "askform") { e.preventDefault(); var i = $("#q"); if (i.value.trim()) { gptAsk(i.value.trim()); i.value = ""; } } });

  function fromHash() {
    var h = location.hash.replace("#", "");
    if (/^order-\d{4}$/.test(h) && byId("SO-" + h.slice(6))) { state.view = "order"; state.order = "SO-" + h.slice(6); state.analyzed[state.order] = true; }
    else if (TITLES[h] && h !== "order") state.view = h;
  }
  window.addEventListener("hashchange", function () { fromHash(); render(); });
  state.gpt.push({ role:"gpt", html:"Hello Meena. I know your process, your machines and your three orders. Ask me about capacity, which order is at risk, whether to accept SO-1195, or what happens if a machine goes down.", calc:[] });
  fromHash(); render();
})();
</script>
